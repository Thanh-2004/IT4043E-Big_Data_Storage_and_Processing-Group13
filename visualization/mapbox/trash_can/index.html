                // Mục tiêu: Tổng độ dài đường vẽ = Config.targetVisualLengthKm (ví dụ 15km)
                // Số đốt cần giữ = Tổng độ dài / Độ dài mỗi đốt (moveDist)
                
                let targetLengthKm = Config.targetVisualLengthKm;
                // Nếu zoom gần thì thu ngắn lại cho đỡ vướng
                if (currentZoom > 7) targetLengthKm = 8;
                if (currentZoom > 9) targetLengthKm = 3;

                // Đây là công thức thần thánh:
                // Nếu moveDist lớn (gió nhanh) -> allowedSegments sẽ nhỏ -> Ít đốt -> Ngắn lại.
                // Nếu moveDist nhỏ (gió chậm) -> allowedSegments sẽ lớn -> Nhiều đốt -> Dài ra.
                // Kết quả: Cả 2 đều có độ dài vật lý xấp xỉ nhau trên bản đồ.
                const allowedSegments = Math.floor(targetLengthKm / moveDist);
                
                // Giới hạn tối thiểu 2 đốt để thành đường thẳng
                const finalSegments = Math.max(2, allowedSegments);

                // Cắt đuôi dựa trên số đốt đã tính
                if (line.currentCoords.length > finalSegments) { 
                    line.currentCoords.shift(); // Xóa điểm cũ nhất
                    // Nếu gió quá nhanh khiến số đốt giảm đột ngột, có thể cần xóa nhiều điểm hơn
                    while(line.currentCoords.length > finalSegments) {
                         line.currentCoords.shift();
                    }
                }

                if (line.currentCoords.length > 1) {
                    features.push(turf.lineString(line.currentCoords));
                }
            }

            const geoJsonData = turf.featureCollection(features);
            map.getSource('wind-lines').setData(geoJsonData);

            requestAnimationFrame(() => this.animate());
        },

        togglePlay: function() {
            if (this.isPlaying) {
                this.isPlaying = false;
                document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-play"></i> Chạy Diễn biến';
                clearInterval(this.timer);
            } else {
                if (this.linesArr.length === 0) { alert("Vui lòng tải dữ liệu trước"); return; }
                this.isPlaying = true;
                document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-pause"></i> Dừng';
                this.animate();

                this.timer = setInterval(async () => {
                    this.currentGlobalHour++;
                    if (this.currentGlobalHour >= this.sortedDates.length * 24) this.currentGlobalHour = 0;
                    await this.updateFrame(this.currentGlobalHour);
                }, 4000); 
            }
        }
    };

    map.on('load', () => {
        // LAYER NỀN
        map.addSource('station-heat-source', { type: 'geojson', data: {type: 'FeatureCollection', features: []} });
        map.addLayer({
            id: 'station-heat-halo',
            type: 'circle',
            source: 'station-heat-source',
            paint: {
                'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 25, 8, 80],
                'circle-blur': 0.8,
                'circle-opacity': 0.6,
                'circle-color': [
                    'interpolate', ['linear'], ['get', 'speed'],
                    0, '#2196f3', 15, '#00e676', 30, '#ffeb3b', 45, '#ff9800', 60, '#f44336', 100, '#d50000'
                ]
            }
        });

        // LAYER ĐƯỜNG GIÓ
        map.addSource('wind-lines', { type: 'geojson', data: turf.featureCollection([]) });
        map.addLayer({
            id: 'wind-lines-draw',
            type: 'line',
            source: 'wind-lines',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: {
                'line-color': 'rgba(255, 255, 255, 0.85)', // Tăng độ sáng lên chút
                'line-width': ['interpolate', ['linear'], ['zoom'], 4, 2.5, 10, 1.5]
            }
        });

        document.getElementById('hour-slider').addEventListener('input', (e) => {
            App.isPlaying = false;
            clearInterval(App.timer);
            document.getElementById('btn-play').innerHTML = '<i class="fa-solid fa-play"></i> Chạy Diễn biến';
            App.updateFrame(parseInt(e.target.value));
        });
    });
</script>

</body>
</html>
