apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: bigdata-pipeline
spec:
  type: NodePort
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
      nodePort: 30017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: bigdata-pipeline
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: bigdata-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:5.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-creds
              key: mongodb_username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-creds
              key: mongodb_password
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
  namespace: bigdata-pipeline
spec:
  type: LoadBalancer
  selector:
    app: mongo-express
  ports:
    - port: 8081        # Internal Container Port (Keep as 8081)
      targetPort: 8081  # Internal Target (Keep as 8081)
      # nodePort: 30082   # External NodePort (Change if needed)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: bigdata-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express
        ports:
        - containerPort: 8081
        env:
        - name: ME_CONFIG_MONGODB_SERVER
          value: mongo-service  # Points to your existing DB service
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-creds
              key: mongodb_username
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-creds
              key: mongodb_password
        - name: ME_CONFIG_BASICAUTH_USERNAME
          value: mongo
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          value: mongo123