---
apiVersion: v1
kind: Service
metadata:
  name: weather-exporter
  namespace: bigdata-pipeline
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: weather-exporter
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-exporter
  namespace: bigdata-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-exporter
  template:
    metadata:
      labels:
        app: weather-exporter
    spec:
      containers:
      - name: weather-exporter
        image: bachthetrollface/weather-exporter:latest
        imagePullPolicy: Always
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:mongo123@mongodb:27017/?authSource=admin" 
        - name: DB_NAME
          value: "weather_db"
        - name: COLLECTION_NAME
          value: "batch_gold"
        ports:
        - containerPort: 8000

---
# 3. Prometheus (Chạy độc lập, không Sidecar)
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: bigdata-pipeline
spec:
  ports:
    - port: 9090
      name: http-prom
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: bigdata-pipeline
spec:
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      volumes:
      - name: config-volume
        configMap:
          name: monitoring-config
      - name: prometheus-data
        emptyDir: {} 
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--web.enable-lifecycle"
        ports:
          - containerPort: 9090
        volumeMounts:
          - name: config-volume
            mountPath: /etc/prometheus/prometheus.yml
            subPath: prometheus.yml
          - name: prometheus-data
            mountPath: /prometheus

---
# 7. Grafana (Kết nối trực tiếp tới http://prometheus:9090)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: bigdata-pipeline
spec:
  type: LoadBalancer 
  ports:
    - port: 7878
      targetPort: 7878
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: bigdata-pipeline
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
          - containerPort: 7878
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_SERVER_HTTP_PORT
          value: "7878"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-mongodb-datasource"
        - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
          value: "grafana-mongodb-datasource"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-exporter
  namespace: bigdata-pipeline
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.7.0
        ports:
          - containerPort: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: bigdata-pipeline
spec:
  ports:
    - port: 9100
      targetPort: 9100
  selector:
    app: node-exporter

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: bigdata-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
      - name: mongodb-exporter
        image: percona/mongodb_exporter:0.40
        args:
          - "--collect-all"        
          - "--compatible-mode"
        env:
        - name: MONGODB_URI
          # Đảm bảo URI này khớp với tên service mongo và password của bạn
          value: "mongodb://mongo:mongo123@mongo.bigdata-pipeline.svc.cluster.local:27017"
        ports:
          - containerPort: 9216
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  namespace: bigdata-pipeline
spec:
  ports:
    - port: 9216
      targetPort: 9216
      protocol: TCP
      name: metrics
  selector:
    app: mongodb-exporter