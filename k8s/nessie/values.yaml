versionStoreType: MONGODB
mongodb:
  database: nessie
  connectionString: mongodb://mongodb:27017 # mongodb://<hostname-of-mongo>:<port>
  secret:
    name: mongodb-creds
    username: mongodb_username
    password: mongodb_password
