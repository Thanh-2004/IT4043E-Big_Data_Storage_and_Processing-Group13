# 1. Spark Master Service (Unchanged)
apiVersion: v1
kind: Service
metadata:
  name: spark-master-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: spark-master
  ports:
    - name: cluster-port
      port: 7077
      targetPort: 7077
    - name: rest-api
      port: 6066
      targetPort: 6066
    - name: web-ui
      port: 8080
      targetPort: 8080
      nodePort: 30001
---
# 2. Spark Master Deployment (UPDATED for Apache Image)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: apache/spark:3.5.0  # <--- Switched to Official Image
        command: [
          "/opt/spark/bin/spark-class", 
          "org.apache.spark.deploy.master.Master"
        ]
        env:
        - name: SPARK_MASTER_OPTS
          value: "-Dspark.master.rest.enabled=true -Dspark.master.rest.port=6066"
        ports:
        - containerPort: 7077
        - containerPort: 6066
        - containerPort: 8080
        volumeMounts:
        - name: spark-jobs
          mountPath: /opt/spark/jobs
        - name: ivy-cache
          mountPath: /tmp
      volumes:
      - name: spark-jobs
        hostPath:
          path: /opt/spark/jobs
          type: Directory
      - name: ivy-cache
        emptyDir: {}
---
# 3. Spark Worker Deployment (UPDATED for Apache Image)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
      - name: spark-worker
        image: apache/spark:3.5.0 # <--- Switched to Official Image
        command: [
          "/opt/spark/bin/spark-class", 
          "org.apache.spark.deploy.worker.Worker",
          "spark://spark-master-svc:7077"
        ]
        volumeMounts:
        - name: spark-jobs
          mountPath: /opt/spark/jobs
        - name: spark-work-dir 
          mountPath: /opt/spark/work
        - name: ivy-cache
          mountPath: /tmp
      volumes:
      - name: spark-jobs
        hostPath:
          path: /opt/spark/jobs
          type: Directory
      - name: spark-work-dir 
        emptyDir: {}
      - name: ivy-cache
        emptyDir: {}
      